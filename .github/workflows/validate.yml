name: validate

# Profile-only repo: there is nothing to build or test, but a required-file
# check still catches an accidental deletion (e.g. a bad rebase dropping
# profile/README.md, which is what GitHub actually renders on the org's
# profile page) and gives every PR at least one real, green check to merge on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files are present
        run: |
          set -e
          for f in \
            README.md \
            profile/README.md; do
            if [ ! -s "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "all required files present"
